<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos Bonificados</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding: 1rem;
            max-width: 100%;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: black;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e67e22;
            font-size: 2 rem;
        }
        .explicacao {
            text-align: center;
            color: black;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        /* Container — 3 por linha em telas pequenas */
        .produtos-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
        }
        .produto-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            padding: 0.8rem;
            text-align: center;
            flex: 0 0 calc(33.333% - 0.6rem); /* Exatamente 3 por linha */
            max-width: calc(33.333% - 0.6rem);
        }
        .produto-imagem {
            max-width: 150px;
            width: 100%;
            height: 70px;
            object-fit: contain;
            margin-bottom: 0.6rem;
        }
        .produto-codigo {
            color: #7f8c8d;
            font-size: 0.75rem;
            margin-bottom: 0.3rem;
        }
        .produto-nome {
            color: #2c3e50;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }
        .produto-preco {
            font-size: 1rem;
            color:red;
            font-weight: bold;
            margin: 0.4rem 0;
        }
        .produto-bonificacao {
            background-color: #fef5e7;
            border-left: 3px solid #e67e22;
            padding: 0.5rem;
            margin-top: 0.5rem;
            border-radius: 0 6px 6px 0;
            color: green;
            font-weight: 600;
            font-size: 0.7rem;
            line-height: 1.3;
        }
        a{
            text-decoration: none;
        }
        /* Ajuste para telas muito pequenas */
        @media (max-width: 360px) {
            .produto-card {
                flex: 0 0 calc(33.333% - 0.4rem);
                max-width: calc(33.333% - 0.4rem);
                padding: 0.5rem;
            }
            .produto-imagem {
                max-width: 50px;
                height: 50px;
            }
            .produto-nome {
                font-size: 0.7rem;
            }
        }
        .img_lista{
            width: 100%;
           text-align: center;
        }
        img{
            width: 90%;
            
        }
      
    </style>
</head>
<body>
    <h1>Produtos Bonificados</h1>
    <p class="explicacao">
        Escolha a marca e veja os produtos bonificados!
    </p>

    <div class="img_lista">
        
           
                <img src="rende_muito.png"> 
               
        
        
    </div>
</body>
</html>
